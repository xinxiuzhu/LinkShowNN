[package]
name = "linkshownn"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "LinkShowNN: multi-platform link cards and media for Nuono"
repository = "https://github.com/xinxiuzhu/LinkShowNN"
readme = "README.md"

[workspace]
resolver = "3"

[lib]
crate-type = ["rlib"]

[[test]]
name = "http_smoke"
path = "tests/http_smoke.rs"
harness = false

[dependencies]
nuono-plugin = { path = "../../crates/nuono-plugin" }
anyhow = "1"
aes = "0.8"
ab_glyph = "0.2"
async-trait = "0.1"
base64 = "0.22"
bpi-rs = { version = "0.3.0", default-features = false, features = ["article", "bangumi", "dynamic", "fav", "live", "login", "opus", "video"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
cipher = { version = "0.4", features = ["block-padding"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
md5 = "0.8"
qrcode = { version = "0.14.1", default-features = false }
regex = "1.10"
resvg = { version = "0.46", default-features = false }
rustybuzz = "=0.20.1"
reqwest = { version = "0.13", features = ["cookies", "form", "json", "query", "stream"] }
# bpi-rs 的客户端/代理接口使用 reqwest 0.12，保留其原有版本与功能。
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util", "process"] }
tracing = "0.1"
unicode-segmentation = "1.13.3"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = false
